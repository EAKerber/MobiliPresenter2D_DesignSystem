<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="938" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
<title id="title">FIND-010 · nível de atenuação do controle indisponível</title>
<desc id="desc">Comparação experimental de três tratamentos para o controle de iluminação indisponível no configurador, em superfícies claras e escuras. A é o estilo atual, B atenua menos e C mantém o texto secundário legível sem opacidade no cartão.</desc>
<defs><style>
text{font-family:Inter,Arial,sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#705C4B}.h{font-size:34px;font-weight:700;fill:#292723}.sub{font-size:17px;fill:#705C4B}.note{font-size:14px;fill:#292723}.cardH{font-size:23px;font-weight:700;fill:#292723}.small{font-size:13px;fill:#705C4B}.label{font-size:14px;font-weight:700}.body{font-size:13px}.tag{font-size:11px;font-weight:700;letter-spacing:.8px}
</style></defs>
<rect width="1600" height="1120" fill="#E8E3DC"/>
<text x="40" y="56" class="k">FIND-010 · CONTROLE INDISPONÍVEL</text>
<text x="40" y="104" class="h">Quanto deve ser atenuado?</text>
<text x="40" y="137" class="sub">A opção “Iluminação embutida” fica desabilitada até que dois módulos sejam incluídos.</text>
<rect x="40" y="160" width="1200" height="66" rx="12" fill="#DED9D2"/>
<text x="60" y="188" class="note"><tspan font-weight="700">Direção já acordada:</tspan> o estado indisponível deve continuar distinguível, sem perder a leitura da orientação que explica como habilitá-lo.</text>
<text x="60" y="211" class="small">Prancha experimental em superfícies da paleta aprovada. A não foi escolhida; B e C não são padrões. Nada foi alterado no produto.</text>
<g transform="translate(40 252) scale(.82)">
<rect width="470" height="780" rx="18" fill="#F0EDE8" stroke="#D6CCC0"/>
<text x="24" y="42" class="cardH">A · Atual</text>
<text x="24" y="68" class="small">Opacity: .6 no cartão inteiro</text>
<rect x="24" y="92" width="422" height="275" rx="14" fill="#F0EDE8" stroke="#D6CCC0"/>
<text x="44" y="122" class="tag" fill="#705C4B">CLARO · FUNDO #F0EDE8</text>
<rect x="44" y="145" width="382" height="190" rx="12" fill="#F0EDE8" stroke="#D6CCC0"/>
<g opacity=".6">
<rect x="62" y="177" width="20" height="20" rx="2" fill="none" stroke="#706C66" stroke-width="2"/>
<text x="98" y="190" class="label" fill="#22211F">Iluminação embutida</text>
<text x="98" y="217" class="body" fill="#706C66">Serviço global que realça a bancada</text><text x="98" y="237" class="body" fill="#706C66">e requer dois módulos específicos.</text>
</g>
<text x="44" y="357" class="small">Texto principal 4,06:1 · orientação 2,23:1</text>
