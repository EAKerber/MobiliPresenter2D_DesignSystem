<text x="28" y="334" class="sample" fill="#22211f">Texto principal · #22211F</text><text x="28" y="362" class="sample" fill="#675f55">Texto secundário · #675F55</text><text x="28" y="390" class="note" fill="#6e512e">Acento / foco · #6E512E</text>
