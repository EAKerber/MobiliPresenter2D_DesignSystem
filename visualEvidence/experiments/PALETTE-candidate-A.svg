<defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:32px;font-weight:700}.sub{font-size:16px}.head{font-size:20px;font-weight:700}.role{font-size:14px;font-weight:700}.hex{font-size:13px;font-family:monospace}.sample{font-size:14px;font-weight:700}.note{font-size:13px}</style></defs>
<rect width="1360" height="980" fill="#e8e3dc"/>
<text x="40" y="55" class="title" fill="#22211f">Paleta candidata A · base quente neutra</text>
<text x="40" y="86" class="sub" fill="#675f55">Consolida famílias já usadas; nenhum valor novo de papel está homologado nesta prancha.</text>
