<text x="28" y="554" class="note" fill="#c4bcb2">Texto escuro supera 9:1 nas amostras preenchidas.</text><rect x="28" y="576" width="564" height="54" rx="10" fill="#20211f" stroke="#4a4843"/><text x="310" y="609" text-anchor="middle" class="sample" fill="#f0ede8">Informação de processo ≠ promoção cobre</text></g>
<text x="40" y="815" class="head" fill="#22211f">Como ler</text><text x="40" y="845" class="sub" fill="#675f55">A proposta escolhe a base neutra quente e reutiliza valores já presentes. Amostras de estado são candidatas.</text><text x="40" y="875" class="sub" fill="#675f55">Contrastes calculados em fundos sólidos; não validam o DOM, transparências, contornos, foco ou disabled.</text><text x="40" y="920" class="note" fill="#675f55">A decidir: acento, estados, variante promocional dark, seleção e disabled.</text></svg>