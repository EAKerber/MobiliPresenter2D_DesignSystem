<text x="28" y="334" class="sample" fill="#f4f1eb">Texto principal · #F4F1EB</text><text x="28" y="362" class="sample" fill="#c4bcb2">Texto secundário · #C4BCB2</text><text x="28" y="390" class="note" fill="#d8bc7c">Acento / foco · #D8BC7C</text>
