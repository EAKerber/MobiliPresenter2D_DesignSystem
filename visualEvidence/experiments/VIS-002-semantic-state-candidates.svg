490" class="sample" fill="#245D87">A etapa ainda não foi publicada.</text><text x="44" y="515" class="ratio" fill="#245D87">#245D87 / #E5EDF2 · 5,93:1</text><rect x="314" y="463" width="278" height="66" rx="12" fill="#222D36"/><text x="330" y="490" class="sample" fill="#A7D1F0">A etapa ainda não foi publicada.</text><text x="330" y="515" class="ratio" fill="#A7D1F0">#A7D1F0 / #222D36 · 8,70:1</text><text x="28" y="585" class="foot">ESQUERDA: CLARO · DIREITA: ESCURO · CONTRASTE TEXTO/FUNDO</text></g>
<g transform="translate(72 890)"><rect width="1296" height="170" rx="20" fill="#A64D13"/><text x="28" y="42" class="promoLabel">COMUNICAÇÃO PROMOCIONAL · REFERÊNCIA APROVADA</text><text x="28" y="82" class="promoTitle">Condição especial por três meses</text><text x="28" y="112" class="promoBody">Base #A64D13 aprovada · texto #F0EDE8 · contraste calculado 4,87:1. Não representa aviso técnico.</text><text x="28" y="145" class="promoBody">As variantes por tema e superfície ainda dependem de medição e revisão.</text></g>
