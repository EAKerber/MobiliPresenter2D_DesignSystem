<text x="72" y="62" class="kicker">VIS-002 · PRANCHA EXPERIMENTAL · NÃO HOMOLOGADA</text>
<text x="72" y="112" class="title">Cores semânticas em contexto</text>
<text x="72" y="145" class="sub">Duas famílias candidatas para erro, sucesso e aviso. Azul de processo é referência aprovada, mantida igual nas duas opções; nenhuma amostra experimental vira token por aparecer nesta prancha.</text>
<text x="72" y="184" class="small">Informação de processo permanece azul. Comunicação promocional usa cobre e fica separada de aviso técnico.</text>
<g transform="translate(72 250)"><rect width="620" height="610" rx="20" fill="#F0EDE8" stroke="#D6CCC0"/><text x="28" y="48" class="paneltitle">A · Terrosa e moderada</text><text x="28" y="78" class="desc">Tons mais suaves, próximos dos neutros quentes.</text><text x="28" y="115" class="rowlabel">ERRO</text><rect x="28" y="127" width="270" height="66" rx="12" fill="#F5E8E5"/><text x="44" y="154" class="sample" fill="#9A3F36">Não foi possível salvar.</text><text x="44" y="179" class="ratio" fill="#9A3F36">#9A3F36 / #F5E8E5 · 5,59:1</text><rect x="314" y="127" width="278" height="66" rx="12" fill="#352522"/><text x="330" y="154" class="sample" fill="#E7AAA2">Não foi possível salvar.</text><text x="330" y="179" class="ratio" fill="#E7AAA2">#E7AAA2 / #352522 · 7,41:1</text><text x="28" y="227" class="rowlabel">SUCESSO</text><rect x="28" y="239" width="270" height="66" rx="12" fill="#E8EFE9"/><text x="44" y="266" class="sample" fill="#3D6C52">Alterações salvas.</text><text x="44" y="291" class="ratio" fill="#3D6C52">#3D6C52 / #E8EFE9 · 5,18:1</text><rect x="314" y="239" width="278" height="66" rx="12" fill="#223129"/><text x="330" y="266" class="sample" fill="#A8CAB1">Alterações salvas.</text><text x="330" y="291" class="ratio" fill="#A8CAB1">#A8CAB1 / #223129 · 7,63:1</text><text x="28" y="339" class="rowlabel">AVISO TÉCNICO</text><rect x="28" y="351" width="270" height="66" rx="12" fill="#F2EBDC"/><text x="44" y="378" class="sample" fill="#785B22">Confira antes de continuar.</text><text x="44" y="403" class="ratio" fill="#785B22">#785B22 / #F2EBDC · 5,33:1</text><rect x="314" y="351" width="278" height="66" rx="12" fill="#332C1E"/><text x="330" y="378" class="sample" fill="#E4C989">Confira antes de continuar.</text><text x="330" y="403" class="ratio" fill="#E4C989">#E4C989 / #332C1E · 8,56:1</text><text x="28" y="451" class="rowlabel">INFORMAÇÃO DE PROCESSO · AZUL REFERÊNCIA</text><rect x="28" y="463" width="270" height="66" rx="12" fill="#E7EEF3"/><text x="44" y="490"