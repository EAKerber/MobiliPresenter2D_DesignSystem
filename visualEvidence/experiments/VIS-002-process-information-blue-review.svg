<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">Candidatos para informação de processo em claro e escuro</title>
<desc id="desc">Comparação experimental entre o azul atualmente usado como referência e uma alternativa com maior contraste, em superfícies claras e escuras homologadas.</desc>
<defs>
<style>
text{font-family:Inter,Arial,sans-serif}
.kicker{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#705C4B}
.title{font-size:34px;font-weight:700;fill:#292723}
.subtitle{font-size:16px;fill:#705C4B}
.cardTitle{font-size:22px;font-weight:700;fill:#292723}
.cardSub{font-size:14px;fill:#705C4B}
.themeLabel{font-size:12px;font-weight:700;letter-spacing:1.2px}
.sample{font-size:17px;font-weight:600}
.ratio{font-size:13px;font-weight:600}
.infoLabel{font-size:14px;font-weight:700}
.note{font-size:14px;fill:#292723}
.small{font-size:12px;fill:#705C4B}
</style>
</defs>
<rect width="1440" height="920" fill="#E8E3DC"/>
<text x="64" y="58" class="kicker">VIS-002 · INFORMAÇÃO DE PROCESSO</text>
<text x="64" y="104" class="title">Qual azul comunica melhor?</text>
<text x="64" y="136" class="subtitle">Mesmo papel, mesma superfície aprovada. A comparação muda apenas o tom do texto em cada tema.</text>
<rect x="64" y="163" width="1312" height="52" rx="12" fill="#DED9D2"/>
<text x="84" y="195" class="note"><tspan font-weight="700">Papel já homologado:</tspan> informação sobre o funcionamento/estado atual. Não é erro, aviso, sucesso ou promoção.</text>

<g transform="translate(64 242)">
<rect width="638" height="548" rx="18" fill="#F0EDE8" stroke="#D6CCC0"/>
<text x="28" y="44" class="cardTitle">A · Referência atual</text>
<text x="28" y="72" class="cardSub">Valores existentes no CSS; servem de comparação, ainda não são tokens oficiais.</text>
<rect x="28" y="102" width="278" height="260" rx="14" fill="#F0EDE8" stroke="#D6CCC0"/>
<text x="46" y="128" class="themeLabel" fill="#705C4B">TEMA CLARO · SUPERFÍCIE #F0EDE8</text>
<circle cx="60" cy="174" r="13" fill="none" stroke="#245D87" stroke-width="2"/>
<text x="56" y="179" class="infoLabel" fill="#245D87">i</text>
<text x="84" y="169" class="sample" fill="#245D87">A etapa ainda não foi</text>
<text x="84" y="193" class="sample" fill="#245D87">publicada.</text>
<text x="46" y="334" class="ratio" fill="#245D87">#245D87 · 6,01:1</text>
<rect x="322" y="102" width="288" height="260" rx="14" fill="#211F1C"/>
<text x="340" y="128" class="themeLabel" fill="#C7BBAA">TEMA ESCURO · SUPERFÍCIE #211F1C</text>
<circle cx="354" cy="174" r="13" fill="none" stroke="#A7D1F0" stroke-width="2"/>
<text x="350" y="179" class="infoLabel" fill="#A7D1F0">i</text>
<text x="378" y="169" class="sample" fill="#A7D1F0">A etapa ainda não foi</text>
<text x="378" y="193" class="sample" fill="#A7D1F0">publicada.</text>
<text x="340" y="334" class="ratio" fill="#A7D1F0">#A7D1F0 · 10,19:1</text>
<text x="28" y="405" class="note"><tspan font-weight="700">Leitura:</tspan> familiar e já presente no produto.</text>
<text x="28" y="431" class="note">No tema claro, tem contraste menor que a alternativa B.</text>
<text x="28" y="505" class="small">Admin atual: --info claro #245D87 · escuro #A7D1F0</text>
</g>

<g transform="translate(738 242)">
<rect width="638" height="548" rx="18" fill="#F0EDE8" stroke="#D6CCC0"/>
<text x="28" y="44" class="cardTitle">B · Maior contraste</text>
<text x="28" y="72" class="cardSub">Alternativa mais profunda no claro e mais luminosa no escuro.</text>
<rect x="28" y="102" width="278" height="260" rx="14" fill="#F0EDE8" stroke="#D6CCC0"/>
<text x="46" y="128" class="themeLabel" fill="#705C4B">TEMA CLARO · SUPERFÍCIE #F0EDE8</text>
<circle cx="60" cy="174" r="13" fill="none" stroke="#1F4F72" stroke-width="2"/>
<text x="56" y="179" class="infoLabel" fill="#1F4F72">i</text>
<text x="84" y="169" class="sample" fill="#1F4F72">A etapa ainda não foi</text>
<text x="84" y="193" class="sample" fill="#1F4F72">publicada.</text>
<text x="46" y="334" class="ratio" fill="#1F4F72">#1F4F72 · 7,43:1</text>
<rect x="322" y="102" width="288" height="260" rx="14" fill="#211F1C"/>
<text x="340" y="128" class="themeLabel" fill="#C7BBAA">TEMA ESCURO · SUPERFÍCIE #211F1C</text>
<circle cx="354" cy="174" r="13" fill="none" stroke="#BDD5E3" stroke-width="2"/>
<text x="350" y="179" class="infoLabel" fill="#BDD5E3">i</text>
<text x="378" y="169" class="sample" fill="#BDD5E3">A etapa ainda não foi</text>
<text x="378" y="193" class="sample" fill="#BDD5E3">publicada.</text>
<text x="340" y="334" class="ratio" fill="#BDD5E3">#BDD5E3 · 10,80:1</text>
<text x="28" y="405" class="note"><tspan font-weight="700">Leitura:</tspan> mantém azul sem aproximar do verde.</text>
<text x="28" y="431" class="note">Mais contraste nos dois temas; tom escuro mais suave.</text>
<text x="28" y="505" class="small">Candidata de estudo · ainda não homologada</text>
</g>
<rect x="64" y="816" width="1312" height="64" rx="12" fill="#DED9D2"/>
<text x="84" y="843" class="note"><tspan font-weight="700">Escopo da escolha:</tspan> apenas os tons do texto de informação de processo nestas superfícies claras/escuras.</text>
<text x="84" y="865" class="small">Fundos, bordas, ícones, uso em outras superfícies e tokens técnicos seguem separados. Os valores foram calculados sobre as superfícies da paleta aprovada.</text>
</svg>